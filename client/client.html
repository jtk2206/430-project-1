<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    const handleResponse = async (response, parseResponse) => {
      
      const content = document.querySelector('#content');

      switch(response.status) {
        case 200:
          content.innerHTML = `<b>Success, ${response.status}</b>`;
          break;
        case 201:
          content.innerHTML = `<b>Created, ${response.status}</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated (No Content), ${response.status}</b>`;
          return;
        case 400:
          content.innerHTML = `<b>Bad Request, ${response.status}</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Not Found, ${response.status}</b>`;
          break;
        default:
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      if (parseResponse){
        const obj = await response.json();
        console.log(obj);
        
        if(obj.message){
          content.innerHTML += `<p>Message: ${obj.message}</p>`;
        } else{
          content.innerHTML += `<p>${JSON.stringify(obj)}</p>`;
        }
      }
    };

    const requestUpdate = async (form) => {
      let url = form.getAttribute('action');
      let method;

      switch(form) {
        case document.querySelector("#getPokemonNamesForm"):
          method = form.querySelector('#getNamesMethodSelect').value;
          break;
        case document.querySelector("#getPokemonForm"):
          const pokemonName = form.querySelector('#getPokemonNameField').value;
          const types = form.querySelector('#getTypesField').value;
          const weaknesses = form.querySelector('#getWeaknessesField').value;
          url += `?name=${pokemonName}&type=${types}&weaknesses=${weaknesses}`;
          method = form.querySelector('#getPokemonMethodSelect').value;
          break;
        case document.querySelector("#getPokemonByNameForm"):
          const name = form.querySelector('#getByNameField').value;
          url += `?name=${name}`;
          method = form.querySelector('#byNameMethodSelect').value;
          break;
        case document.querySelector("#getAllPokemonForm"):
          method = form.querySelector('#allMethodSelect').value;
          break;
      }
      
      let response = await fetch(url, {
        method,
        headers: {
            'Accept': 'application/json'
        },
      });

      handleResponse(response, method === 'get');
    };

    const sendPost = async (form) => {
      const url = form.getAttribute('action');
      const method = form.getAttribute('method');
      let formData;
      
      if (form === document.querySelector('#addPokemonForm')){
        const name = form.querySelector('#addNameField').value;
        const types = form.querySelector('#addTypesField').value;
        const weaknesses = form.querySelector('#addWeaknessesField').value;
        formData = `name=${name}&types=${types}&weaknesses=${weaknesses}`;
      } else{
        const name = form.querySelector('#generationNameField').value;
        const generation = form.querySelector('#generationField').value;
        formData = `name=${name}&generation=${generation}`;
      }


      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Content-Length': formData.length,
          'Accept': 'application/json',
        },
        body: formData,
      });

      handleResponse(response, true);
    };

    const init = () => {
      const nameForm = document.querySelector('#addPokemonForm');
      const generationForm = document.querySelector('#generationForm');
      const getPokemonNamesForm = document.querySelector('#getPokemonNamesForm');
      const getPokemonForm = document.querySelector('#getPokemonForm');
      const getPokemonByNameForm = document.querySelector('#getPokemonByNameForm');
      const getAllPokemonForm = document.querySelector('#getAllPokemonForm');
      
      const postListener = (e, form) => {
        e.preventDefault();
        sendPost(form);
        return false;
      }
      
      const getListener = (e, form) => {
        e.preventDefault();
        requestUpdate(form);
        return false;
      }

      nameForm.addEventListener('submit', (e) => postListener(e,nameForm));
      generationForm.addEventListener('submit', (e) => postListener(e,generationForm));
      getPokemonNamesForm.addEventListener('submit', (e) => getListener(e,getPokemonNamesForm));
      getPokemonForm.addEventListener('submit', (e) => getListener(e,getPokemonForm));
      getPokemonByNameForm.addEventListener('submit', (e) => getListener(e,getPokemonByNameForm));
      getAllPokemonForm.addEventListener('submit', (e) => getListener(e,getAllPokemonForm));
    };

    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h1>Pokemon API Method Tests</h1>
    <h3>/getPokemonNames</h3>
    <form id="getPokemonNamesForm" action="/getPokemonNames" method="get">
      <select id="getNamesMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon Names" />
    </form>
    <h3>/getPokemon</h3>
    <form id="getPokemonForm" action="/getPokemon" method="get">
      <label for="name">Name: </label>
      <input id="getPokemonNameField" type="text" name="name" />
      <label for="types">Type(only one): </label>
      <input id="getTypesField" type="text" name="types" min="0" max="100" step="1"/>
      <label for="weaknesses">Weakness(only one): </label>
      <input id="getWeaknessesField" type="text" name="weaknesses" min="0" max="100" step="1"/>
      <select id="getPokemonMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon" />
    </form>
    <h3>/getPokemonByName</h3>
    <form id="getPokemonByNameForm" action="/getPokemonByName" method="get">
      <label for="name">Name: </label>
      <input id="getByNameField" type="text" name="name" />
      <select id="byNameMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon By Name" />
    </form>
    <h3>/getAllPokemon</h3>
      <form id="getAllPokemonForm" action="/getAllPokemon" method="get">
      <select id="allMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get All Pokemon" />
    </form>
    <h3>/addPokemon</h3>
    <form id="addPokemonForm" action="/addPokemon" method="post">
      <label for="name">Name: </label>
      <input id="addNameField" type="text" name="name" />
      <label for="types">Types: </label>
      <input id="addTypesField" type="text" name="types" min="0" max="100" step="1"/>
      <label for="weaknesses">Weaknesses: </label>
      <input id="addWeaknessesField" type="text" name="weaknesses" min="0" max="100" step="1"/>
      <input type="submit" value="Add Pokemon" />
    </form>
    <h3>/addGeneration</h3>
    <form id="generationForm" action="/addGeneration" method="post">
      <label for="name">Name: </label>
      <input id="generationNameField" type="text" name="name" />
      <label for="generation">Generation: </label>
      <input id="generationField" type="text" name="types" min="0" max="100" step="1"/>
      <input type="submit" value="Add Generation" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
